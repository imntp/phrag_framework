
[loader]
; PDF_FILE, TXT_FILE.
plugin_name = PDF_FILE 

[chunker]
; FIXED_SIZE, TOKEN_BASED, RECURSIVE_CHARACTER
plugin_name = RECURSIVE_CHARACTER 
chunk_size = 100
chunk_overlap = 20

[embeddings]
; OPENAI, HUGGINGFACE, etc.
plugin_name = OPENAI
model_name = text-embedding-3-small

[vectorstore]
; CHROMA, FAISS, etc.
plugin_name = CHROMA
save_directory = ./chromadb_1
collection_name = atmega_collection